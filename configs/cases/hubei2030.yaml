case_name: "hubei2030"
data_root: "./湖北2030"

files:
  zone: "分区.xls"
  transmission: "断面.xls"
  thermal: "火电机组.xls"
  hydro: "水电机组.xls"
  storage: "储能机组.xls"
  pumped_storage: "抽蓄电机组.xls"
  hydro_mapping: "流域对应水电.xlsx"
  load_spec: "负荷数据.xls"
  wind_spec: "风电装机.xls"
  pv_spec: "光伏装机.xls"
  scenario_curves: "scenario_load_res_18yr_8760.xlsx"

directories:
  multi_scenario: "多场景数据"
  hydro_basin_flows: "流域三段式"
  power_flows: "电力流"

field_mappings:
  zone:
    "分区名称": "zone_name"
    "负荷备用率": "load_reserve_rate"
    "事故备用率": "contingency_reserve_rate"
    "事故热备用比例": "spinning_reserve_rate"
    "事故冷备用比例": "non_spinning_reserve_rate"
    "保安电源容量（MW）": "security_power_mw"
    "跨区调剂比例": "inter_regional_support_rate"
  transmission:
    "断面名称": "line_name"
    "断面类型": "line_type"
    "分区1": "zone_from"
    "分区2": "zone_to"
    "正向极限（MW)": "limit_mw"
    "联络线控制类型": "control_type"
  thermal:
    "机组编码": "unit_id"
    "所属厂站": "plant_name"
    "机端母线": "bus_name"
    "电压等级(KV)": "voltage_kv"
    "额定功率(MW)": "p_max_mw"
    "所属分区": "zone_name"
    "投产时间": "commission_date"
    "退役时间": "retirement_date"
    "最小功率(MW)": "p_min_mw"
    "最小连续运行时间(小时)": "min_up_time_h"
    "最小连续停机时间(小时)": "min_down_time_h"
    "常规爬坡速率": "ramp_rate_mw_per_min"
    "变动运行费(元/千瓦时)": "fuel_cost_per_kwh"
    "运行维护成本(元/兆瓦时)": "vom_cost_per_mwh"
  hydro:
    "机组编码": "unit_id"
    "所属厂站": "plant_name"
    "机端母线": "bus_name"
    "额定功率(MW)": "p_max_mw"
    "所属分区": "zone_name"
    "最小功率(MW)": "p_min_mw"
    "流域名称": "basin_name"
  storage:
    "机组编码": "unit_id"
    "所属厂站": "plant_name"
    "机端母线": "bus_name"
    "额定功率(MW)": "p_max_mw"
    "所属分区": "zone_name"
    "额定容量(MWh)": "energy_capacity_mwh"
    "充电效率(%)": "charge_efficiency"
    "放电效率(%)": "discharge_efficiency"
    "初始电量(%)": "init_soc"
  pumped_storage:
    "机组编码": "unit_id"
    "所属厂站": "plant_name"
    "机端母线": "bus_name"
    "额定功率(MW)": "p_max_mw"
    "所属分区": "zone_name"
    "额定容量(MWh)": "energy_capacity_mwh"
    "抽水效率(%)": "charge_efficiency"
    "发电效率(%)": "discharge_efficiency"
    "初始电量(%)": "init_soc"
curves:
  zones: [ "鄂东", "鄂西", "鄂西北" ]
  load_pattern: "{zone}负荷.xls"
  wind_pattern: "{zone}风{suffix}.xls"
  pv_pattern: "{zone}光{suffix}.xls"

dc_flows_config:
  lines:
    "灵宝直流": "灵宝直流2030_8760"
    "第三直流入鄂": "第三直流入鄂2030_8760"
    "金上直流": "金上直流2030_8760"
    "陕湖直流": "陕湖直流2030_8760"

grid_zone_mapping:
  "武汉": "鄂东"
  "黄冈": "鄂东"
  "咸宁": "鄂东"
  "孝感": "鄂东"
  "黄石": "鄂东"
  "鄂州": "鄂东"
  "随州": "鄂东"
  "宜昌": "鄂西"
  "荆州": "鄂西"
  "荆门": "鄂西"
  "恩施": "鄂西"
  "十堰": "鄂西北"
  "襄樊": "鄂西北"
  "襄阳": "鄂西北"
  "神农架": "鄂西北"

parameter_defaults:
  thermal:
    fuel_cost_per_kwh: 0.35      # 燃料成本默认值（元/kWh）
    vom_cost_per_mwh: 0.0        # 变动运维成本默认值（元/MWh）
  storage:
    init_soc_percent: 0.5        # 储能初始电量默认值（实际读取的键名）
  pumped_storage:
    init_soc_percent: 0.5        # 抽蓄初始电量默认值（实际读取的键名）